[app]
Title=Shadow Warrior (Shareware)
Author=JFSW by Jonathon Fowler; Shadow Warrior by 3D Realms, 1997
Version=20260105-2
Image=icon.png
Readme=readme.txt
# the program for this machine (the launcher's docs/app-format-plan.md): bin/psc/sw on the console, bin/rpi,
# bin/rpi64, bin/pcusb on the appliances, bin/win/sw.exe on Windows. The launcher starts an App in its own
# folder; user_profiles_disabled there keeps the settings (sw.cfg) and the saves in it too.
Exec=bin/{key}/sw
# no setup dialogue (it would stop at a window a pad cannot use); full screen at 640x480 is the default, drawn
# 4:3 over the display's full height
Args=-nosetup
# SDL2 is the launcher's (the console, Windows) or the system's - nothing of its own
# JFSW reads the pad through SDL's GameController API; the virtual pad shows it an Xbox 360 pad, which
# patches/jfsw/0001-psc-pad-layout.patch lays out as the 2020 PlayStation Classic port did
VirtualPad=true
Kernel=false
